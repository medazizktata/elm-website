<picture>
  <source type="image/webp" srcset="images/{{base}}-400.webp 400w, images/{{base}}-800.webp 800w{{#if wide}}, images/{{base}}-1200.webp 1200w{{/if}}" sizes="{{sizes}}">
  <img src="images/{{base}}-800.webp" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy"{{#if class}} class="{{class}}"{{/if}}>
</picture>
