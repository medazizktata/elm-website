<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{siteUrl}}/"
    }{{#if breadcrumb1Name}},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{breadcrumb1Name}}",
      "item": "{{siteUrl}}/{{breadcrumb1Url}}"
    }{{/if}},
    {
      "@type": "ListItem",
      "position": {{#if breadcrumb1Name}}3{{else}}2{{/if}},
      "name": "{{pageTitle}}",
      "item": "{{siteUrl}}/{{ogPath}}"
    }
  ]
}
</script>
