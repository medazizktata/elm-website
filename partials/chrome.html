<div class="page-loader" aria-hidden="true">
  <div class="page-loader__brand"></div>
</div>
<script>
(function () {
  // Reveal only after hero + fonts + main CSS — kills deferred-CSS CLS race
  if (window.__elmPageLoaderHidden) return;
  var shownAt = Date.now();
  var MIN_MS = 100;
  var MAX_MS = 4000;
  var FONT_WAIT_MS = 1200;
  var CSS_WAIT_MS = 2500;
  var done = false;

  function hide() {
    if (done || window.__elmPageLoaderHidden) return;
    done = true;
    window.__elmPageLoaderHidden = true;
    var wait = Math.max(0, MIN_MS - (Date.now() - shownAt));
    setTimeout(function () {
      var root = document.documentElement;
      var loader = document.querySelector(".page-loader");
      root.classList.remove("is-page-loading");
      if (loader) loader.classList.remove("is-active");
      document.body.style.removeProperty("overflow");
    }, wait);
  }

  function fontsReady() {
    if (!document.fonts || !document.fonts.ready) return Promise.resolve();
    return Promise.race([
      document.fonts.ready,
      new Promise(function (resolve) {
        setTimeout(resolve, FONT_WAIT_MS);
      }),
    ]);
  }

  function mainCssReady() {
    return new Promise(function (resolve) {
      function isApplied(link) {
        if (!link) return false;
        if (link.media && link.media !== "all" && link.media !== "screen") return false;
        try {
          return !!(link.sheet && link.sheet.cssRules && link.sheet.cssRules.length);
        } catch (e) {
          return link.sheet != null;
        }
      }

      var link =
        document.querySelector('link[href*="style.css"]') ||
        document.querySelector('link[href*="/style-"]') ||
        document.querySelector('link[data-elm-main-css]');

      if (isApplied(link)) {
        resolve();
        return;
      }

      var settled = false;
      function doneCss() {
        if (settled) return;
        settled = true;
        requestAnimationFrame(function () {
          requestAnimationFrame(resolve);
        });
      }

      if (link) {
        link.addEventListener("load", doneCss, { once: true });
        link.addEventListener("error", doneCss, { once: true });
        // media=print → all swap often happens in onload=; poll briefly
        var n = 0;
        (function poll() {
          if (isApplied(link) || n++ > 50) doneCss();
          else setTimeout(poll, 40);
        })();
      } else {
        doneCss();
      }

      setTimeout(doneCss, CSS_WAIT_MS);
    });
  }

  function afterReady() {
    Promise.all([fontsReady(), mainCssReady()]).then(hide);
  }

  function armHero(img) {
    function go() {
      afterReady();
    }
    if (img.complete && img.naturalWidth) {
      go();
      return;
    }
    img.addEventListener("load", go, { once: true });
    img.addEventListener("error", go, { once: true });
    if (img.decode) img.decode().then(go).catch(function () {});
  }

  function start() {
    var img = document.querySelector(".hero__media-img");
    if (img) armHero(img);
    else if (document.readyState === "complete") afterReady();
    else window.addEventListener("load", afterReady, { once: true });
    setTimeout(hide, MAX_MS);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
