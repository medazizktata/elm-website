<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
<meta name="theme-color" content="#BD1F71"/>
<title>{{documentTitle pageTitle}}</title>
<meta name="application-name" content="{{siteName}}">
<meta name="author" content="{{siteName}}">
<meta name="description" content="{{description}}">
<meta name="robots" content="{{#if noindex}}noindex, follow{{else}}index, follow{{/if}}">
<meta name="geo.region" content="AE-DU">
<meta name="geo.placename" content="Dubai">

<meta property="og:title" content="{{documentTitle pageTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_AE">
<meta property="og:url" content="{{siteUrl}}/{{ogPath}}">
<meta property="og:image" content="{{#if ogImage}}{{siteUrl}}/{{ogImage}}{{else}}{{siteUrl}}/images/tab01-gradient-800.webp{{/if}}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{documentTitle pageTitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{#if ogImage}}{{siteUrl}}/{{ogImage}}{{else}}{{siteUrl}}/images/tab01-gradient-800.webp{{/if}}">

<link rel="canonical" href="{{siteUrl}}/{{ogPath}}">
<link rel="alternate" hreflang="en" href="{{siteUrl}}/{{ogPath}}">
<link rel="alternate" hreflang="x-default" href="{{siteUrl}}/{{ogPath}}">
<link rel="alternate" type="text/plain" href="{{siteUrl}}/llms.txt" title="LLM site summary">
{{#if pageTitle}}
{{> json-ld-breadcrumbs}}
{{/if}}
{{> theme-init}}
{{> locale-init}}
